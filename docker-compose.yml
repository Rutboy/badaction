services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    image: ${DOCKER_MIGRATOR_IMAGE:-badaction-migrator:local}
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/retro?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: "no"

  app:
    profiles: ["app"]
    image: ${DOCKER_RUNNER_IMAGE:-badaction-runner:local}
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/retro?schema=public}
      VISITOR_TOKEN_SECRET: ${DOCKER_VISITOR_TOKEN_SECRET:-local-compose-visitor-secret-0000000000000001}
      BOARD_ACCESS_SECRET: ${DOCKER_BOARD_ACCESS_SECRET:-local-compose-board-access-secret-0000000000000002}
      RATE_LIMIT_KEY_SECRET: ${DOCKER_RATE_LIMIT_KEY_SECRET:-local-compose-rate-limit-secret-0000000000000003}
      APP_ORIGIN: ${DOCKER_APP_ORIGIN:-http://localhost:3000}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      BOARD_RETENTION_DAYS: ${BOARD_RETENTION_DAYS:-90}
      BOARD_CARD_LIMIT: ${BOARD_CARD_LIMIT:-500}
      RETENTION_CLEANUP_ENABLED: ${RETENTION_CLEANUP_ENABLED:-true}
      RETENTION_CLEANUP_INTERVAL_MINUTES: ${RETENTION_CLEANUP_INTERVAL_MINUTES:-60}
      RETENTION_CLEANUP_BATCH_SIZE: ${RETENTION_CLEANUP_BATCH_SIZE:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health', { signal: AbortSignal.timeout(2000) }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 5

volumes:
  postgres-data:
